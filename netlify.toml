[build]
  base = "plant-id-travel-app"
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# API proxy to Netlify Functions (must come before SPA catch-all)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA client-side routing - send all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
