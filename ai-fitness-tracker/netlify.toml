[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[functions."weekly-report"]
  schedule = "0 8 * * 1"

[functions."sms-reminders"]
  schedule = "0 7,20 * * *"

[functions."daily-coach"]
  schedule = "0 5 * * *"

[functions."health-baseline"]
  timeout = 26

[functions."onboarding-agent"]
  timeout = 26

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
